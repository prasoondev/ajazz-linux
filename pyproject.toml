[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ajazzctl"
version = "0.1.0"
description = "Unofficial Linux configuration tool for the AJAZZ AK820 Max Plus keyboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject"]
music = ["numpy"]

[project.scripts]
ajazzctl = "ajazzctl.cli:main"

[project.gui-scripts]
ajazzctl-gui = "ajazzctl.gui:main"

[tool.setuptools]
packages = ["ajazzctl"]
